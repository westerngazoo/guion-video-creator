[package]
name = "guion-cli"
version = "0.1.0"
description = "guion command-line interface: check + render (R-0003)"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "guion"
path = "src/main.rs"

[dependencies]
guion-assemble = { workspace = true }
guion-audio = { workspace = true }
guion-brand = { workspace = true }
guion-core = { workspace = true }
guion-encode = { workspace = true }
guion-motion = { workspace = true }
motoreel = { workspace = true }
# R-0012: the narrated reel's pipeline and its gate.
guion-publish = { workspace = true }
guion-reel = { workspace = true }
# R-0013: the accounts dashboard (`guion tablero`) and `guion reel nuevo`.
guion-tablero = { workspace = true }
# R-0014: `guion cuenta nueva|perfil`, and `guion reel sonido` (the neutral kit).
guion-cuenta = { workspace = true }
guion-marca = { workspace = true }
# R-0015: `guion studio <post>`, the gadget studio on localhost.
guion-estudio = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
